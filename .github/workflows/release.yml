  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: mihailinl/AstraPlugins/.github/workflows/plugin-release.yml@b6e9140d53060585c70280e979b58202f34966ba
    with:
      plugin-dir: .
      tag-prefix: "v"
      linux-packages: ""
